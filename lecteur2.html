<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Reine des Cendres — Lecteur audio</title>
<style>
:root{color-scheme:dark;--pink:#f783d6;--blue:#8bdcff;--text:#f7edff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;background:transparent!important;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden}
.player{width:min(100%,510px);margin:0 auto;position:relative;overflow:hidden;padding:17px 20px 15px;border-radius:17px;border:1px solid #a16bc6;background:linear-gradient(135deg,#241331 0%,#111124 55%,#1b122b 100%);box-shadow:inset 0 0 24px #a13fc719}
/* Tous les effets lumineux restent dans le lecteur. Aucun halo externe, aucune projection. */
.player::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(100deg,#ff85d50c,transparent 40%,#77ceff0d)}
.top,.transport,.foot,.seekrow{position:relative;z-index:1}
.top{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.emblem{width:45px;height:45px;flex:none;border-radius:13px;display:grid;place-items:center;border:1px solid #b47fea;background:linear-gradient(150deg,#5a296e,#241c4c);box-shadow:inset 0 0 12px #cf77fb3d}
.emblem svg{width:27px;height:27px;fill:none;stroke:#f4c6fa;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.names{min-width:0;flex:1}.eyebrow{color:#bdb1da;text-transform:uppercase;letter-spacing:.17em;font-size:9px;margin-bottom:2px}
h1{font:500 clamp(15px,4.8vw,21px)/1.14 Georgia,"Times New Roman",serif;letter-spacing:.06em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{margin:4px 0 0;color:#d4bddc;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transport{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:13px}
button{appearance:none;cursor:pointer;display:grid;place-items:center;flex:none;color:#fbe9ff;touch-action:manipulation}
.btn{height:38px;width:38px;border-radius:11px;border:1px solid #80649d;background:#30203e;transition:background .16s,border-color .16s,transform .16s}
.btn:hover{background:#492853;border-color:#e0a4ff}.btn:active{transform:scale(.94)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.play{height:54px;width:54px;border-radius:50%;background:linear-gradient(145deg,#ba6cb9,#5a296d);border:1px solid #ffc5f1;box-shadow:inset 0 0 12px #f3b2ee36}
.play:hover{background:linear-gradient(145deg,#d280c8,#71347e)}.play svg{fill:currentColor;stroke:none;width:25px;height:25px}
.loop.on{color:#ffd3f2;border-color:var(--pink)}
.seekrow{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.time{font-size:10px;color:#d9cae4;min-width:30px;font-variant-numeric:tabular-nums}.time:last-child{text-align:right}
input[type="range"]{appearance:none;-webkit-appearance:none;cursor:pointer;border:0;outline-offset:4px}
#seek{width:100%;min-width:0;height:6px;border-radius:10px;background:linear-gradient(90deg,#e77ed4 var(--pct,0%),#41304d var(--pct,0%))}
input[type=range]::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;background:#f7d8fd;border:2px solid #bd83e2}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#f7d8fd;border:2px solid #bd83e2}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.volume{display:flex;align-items:center;gap:8px;color:#b9a6cd}
.volume svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}
#volume{width:80px;height:4px;border-radius:10px;background:linear-gradient(90deg,#b58ae4 var(--pct,80%),#483451 var(--pct,80%))}
#volume::-webkit-slider-thumb{width:10px;height:10px;border:none;background:#e8bbff}
#volume::-moz-range-thumb{width:10px;height:10px;border:none;background:#e8bbff}
.status{color:#bfb5d8;font-size:9px;letter-spacing:.05em;text-align:right}
.status::before{content:"";display:inline-block;width:5px;height:5px;vertical-align:middle;margin-right:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 5px var(--blue)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
@media(max-width:360px){.player{border-radius:12px;padding:13px 12px 12px}.eyebrow{font-size:8px}.transport{margin-bottom:11px}.top{margin-bottom:10px}.volume #volume{width:50px}.status{font-size:8px}}
</style>
</head>
<body>
<main class="player" aria-label="Lecteur audio La Reine des Cendres">
  <div class="top">
    <div class="emblem" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 4v24M4 16h24M7.5 7.5l17 17m0-17-17 17"/><path d="M16 4c3 5 4 8 0 12-4-4-3-7 0-12zm12 12c-5 3-8 4-12 0 4-4 7-3 12 0zM16 28c-3-5-4-8 0-12 4 4 3 7 0 12zM4 16c5-3 8-4 12 0-4 4-7 3-12 0z"/></svg></div>
    <div class="names"><div class="eyebrow">OBSIDIA · BANDE ORIGINALE</div><h1>LA REINE DES CENDRES</h1><p class="subtitle">Nothing to me...</p></div>
  </div>
  <div class="transport">
    <button class="btn" id="restart" title="Recommencer" aria-label="Recommencer le morceau"><svg viewBox="0 0 24 24"><path d="M19 20V4M16 5 6 12l10 7V5Z"/></svg></button>
    <button class="btn play" id="play" title="Lecture" aria-label="Lire la musique"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 4.5 20 12 8 19.5Z"/></svg></button>
    <button class="btn loop on" id="loop" aria-label="Désactiver la boucle" aria-pressed="true" title="Boucle activée"><svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></svg></button>
  </div>
  <div class="seekrow"><span class="time" id="elapsed">0:00</span><input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Position dans la musique"><span class="time" id="duration">0:00</span></div>
  <div class="foot"><label class="volume"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4 4a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></svg><input type="range" id="volume" min="0" max="100" value="80" aria-label="Volume sonore"></label><span class="status" id="status" role="status">PRÊT · BOUCLE ACTIVE</span></div>
  <audio id="audio" preload="metadata" loop src="episode2.mp3.mp3"></audio>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),a=$('audio'),play=$('play'),loop=$('loop'),seek=$('seek'),volume=$('volume'),status=$('status');
a.volume=.8;a.loop=true;
const fmt=t=>Number.isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00';
function progress(){ $('elapsed').textContent=fmt(a.currentTime);$('duration').textContent=fmt(a.duration);if(!seek.matches(':active')){seek.value=a.duration?Math.round(a.currentTime/a.duration*1000):0;seek.style.setProperty('--pct',(Number(seek.value)/10)+'%')} }
function sync(){const playing=!a.paused;$('playIcon').innerHTML=playing?'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>':'<path d="M8 4.5 20 12 8 19.5Z"/>';play.setAttribute('aria-label',playing?'Mettre en pause':'Lire la musique');status.textContent=(playing?'EN LECTURE':'PRÊT')+' · '+(a.loop?'BOUCLE ACTIVE':'BOUCLE DÉSACTIVÉE')}
play.addEventListener('click',async()=>{if(a.paused){try{await a.play()}catch(e){status.textContent='ERREUR · VÉRIFIER LE MP3';return}}else a.pause();sync()});
$('restart').addEventListener('click',()=>{a.currentTime=0;progress()});
loop.addEventListener('click',()=>{a.loop=!a.loop;loop.classList.toggle('on',a.loop);loop.setAttribute('aria-pressed',String(a.loop));loop.setAttribute('aria-label',a.loop?'Désactiver la boucle':'Activer la boucle');sync()});
seek.addEventListener('input',()=>{seek.style.setProperty('--pct',(Number(seek.value)/10)+'%');if(a.duration)a.currentTime=Number(seek.value)/1000*a.duration});
volume.addEventListener('input',()=>{a.volume=Number(volume.value)/100;volume.style.setProperty('--pct',volume.value+'%')});volume.style.setProperty('--pct','80%');
for(const event of ['timeupdate','loadedmetadata','durationchange','seeked'])a.addEventListener(event,progress);
for(const event of ['play','pause','ended'])a.addEventListener(event,sync);
a.addEventListener('error',()=>{status.textContent='MP3 INTROUVABLE'});
progress();sync();
})();
</script>
</body>
</html>
