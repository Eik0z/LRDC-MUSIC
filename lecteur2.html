<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Reine des Cendres — Lecteur Obsidia</title>
<style>
:root{color-scheme:dark;--pink:#ff59bd;--purple:#b779ff;--blue:#56cfff;--ink:#07050d;--white:#f8f0ff}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;background:transparent!important;color:var(--white);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:11px 10px 15px;overflow-x:hidden;background:transparent!important}
button,input{font:inherit}
main{position:relative;width:min(100%,1050px);margin:auto;isolation:isolate;background:transparent}
/* All effects remain INSIDE the player, so Google Sites never needs extra space above it. */
.aura{position:absolute;inset:-2px;z-index:-1;border-radius:19px;background:linear-gradient(110deg,#15bfff,#ff4db6,#8d53ff,#3af3ff,#ff4db6);background-size:300% 100%;animation:borderflow 10s linear infinite;filter:drop-shadow(0 0 12px #d240db77)}
.shell{position:relative;overflow:hidden;border:1px solid #b78afd80;border-radius:17px;background:#04030a;box-shadow:0 16px 40px #000b,0 0 25px #792b9d55,inset 0 0 25px #381e6855}
.art{position:relative;width:100%;aspect-ratio:2048/682;overflow:hidden;background:#050411}
.art>img{display:block;width:100%;height:100%;object-fit:contain}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#08061380,transparent 25%),linear-gradient(100deg,#6e2ad70d,transparent 50%,#f044ba12);pointer-events:none}
.art::before{content:"";position:absolute;inset:-100% -65%;z-index:2;pointer-events:none;opacity:.35;background:linear-gradient(105deg,transparent 42%,#73dafa16 49%,#fff6 50%,#dd4fff18 51%,transparent 58%);transform:translateX(-60%) rotate(4deg);animation:glint 14s ease-in-out infinite}
.sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;mix-blend-mode:screen}
.impact{position:absolute;left:53%;top:38%;width:18%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff 0%,#fff6ddab 6%,#ff75d67a 17%,#7b87ff38 39%,transparent 72%);mix-blend-mode:screen;animation:impact 5.4s ease-in-out infinite;pointer-events:none;z-index:3;filter:blur(1px)}
.impact::after{content:"";position:absolute;inset:-45%;border-radius:50%;background:conic-gradient(from 10deg,transparent 0 10%,#b5f4ff55 12%,transparent 14% 35%,#ff93ed6e 38%,transparent 40% 64%,#fff6 68%,transparent 70%);animation:impactSpin 5.4s linear infinite;opacity:0}
.flower{position:absolute;left:50%;top:82%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,#99ebff5c 0%,#1bbcff2f 26%,transparent 65%);mix-blend-mode:screen;animation:flower 4s ease-in-out infinite;pointer-events:none;z-index:3}
.rune{position:absolute;left:50%;bottom:4%;width:26%;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#8feeff,transparent);box-shadow:0 0 13px #2ebfff;animation:rune 4s infinite;pointer-events:none;z-index:4}
.panel{position:relative;display:grid;grid-template-columns:minmax(170px,1fr) auto;grid-template-areas:"heading controls" "progress progress" "foot foot";column-gap:18px;row-gap:11px;padding:17px 24px 16px;background:radial-gradient(ellipse at 50% -70%,#76216b70,transparent 68%),linear-gradient(115deg,#120b21,#080b18 52%,#1c0b22);border-top:1px solid #e46df28a}
.panel::before{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,var(--pink),#b778ff,var(--blue),transparent);filter:blur(1px);opacity:.75}
.heading{grid-area:heading;align-self:center;min-width:0}
.kicker{font-size:9px;letter-spacing:.26em;color:#a7a6d1;text-transform:uppercase;margin-bottom:3px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(15px,2vw,22px);letter-spacing:.105em;font-weight:500;margin:0;text-shadow:0 0 14px #bf72ff90;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{font-size:11px;color:#c6afd8;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{grid-area:controls;display:flex;align-items:center;gap:9px;justify-content:end}
button{color:#f8e9ff;cursor:pointer;display:grid;place-items:center;flex:none;touch-action:manipulation}
.ctrl{width:41px;height:41px;border:1px solid #976abc85;border-radius:12px;background:linear-gradient(135deg,#301841,#150d29);box-shadow:inset 0 1px 0 #fff1,0 2px 12px #0006;transition:transform .18s,border-color .18s,box-shadow .18s}
.ctrl:hover{transform:translateY(-2px);border-color:#eeb5ff;box-shadow:0 0 18px #ac62ff55}
.ctrl:active{transform:scale(.94)}
.ctrl svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctrl.primary{height:52px;width:52px;border-radius:50%;color:white;background:radial-gradient(circle at 32% 25%,#aa53b0,#511e67 60%,#1b1241);border:1px solid #ff9cda;box-shadow:0 0 0 4px #e962c11b,0 0 20px #f35bb778,inset 0 1px 0 #fff4}
.ctrl.primary svg{width:24px;height:24px;fill:currentColor;stroke:none}
.ctrl.is-on{color:#ffb8ec;border-color:#fb6bc7;box-shadow:0 0 15px #f35bb76e,inset 0 0 12px #c2359660}
.ctrl.is-on svg{filter:drop-shadow(0 0 5px #ff70cd)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.progress{grid-area:progress;display:flex;align-items:center;gap:12px;min-width:0}
.time{font-size:11px;color:#d3c6e3;font-variant-numeric:tabular-nums;min-width:35px;text-align:center}
input[type=range]{--percent:0%;appearance:none;-webkit-appearance:none;cursor:pointer;border:0;outline-offset:5px}
#seek{width:100%;min-width:0;height:6px;border-radius:99px;background:linear-gradient(90deg,#ff67c2 0%,#9368fe var(--percent),#42304f var(--percent),#292336 100%);box-shadow:0 0 6px #b45aff52}
input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:#f5d5ff;border:2px solid #bc86ff;box-shadow:0 0 12px #d680ff}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#f5d5ff;border:2px solid #bc86ff;box-shadow:0 0 12px #d680ff}
.foot{grid-area:foot;display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.vol{display:flex;align-items:center;gap:10px;color:#c9addf}
.vol svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
#volume{height:4px;width:84px;border-radius:20px;background:linear-gradient(90deg,#ca87ff 0%,#ca87ff var(--percent),#3b3150 var(--percent))}
#volume::-webkit-slider-thumb{width:11px;height:11px;border-width:1px}
#volume::-moz-range-thumb{width:9px;height:9px;border-width:1px}
.status{font-size:10px;color:#b9add4;letter-spacing:.07em;text-align:right;min-width:0}
.status::before{content:"";display:inline-block;width:5px;height:5px;border-radius:100%;background:#66dafa;box-shadow:0 0 8px #56cfff;vertical-align:middle;margin-right:7px}
body.playing .aura{animation-duration:5s}
body.playing .panel::before{filter:drop-shadow(0 0 6px #f972df)}
@keyframes borderflow{to{background-position:300% 0}}
@keyframes glint{0%,70%,100%{transform:translateX(-70%) rotate(4deg);opacity:0}78%{opacity:.32}91%{transform:translateX(65%) rotate(4deg);opacity:0}}
@keyframes impact{0%,62%,82%,100%{opacity:.12;transform:translate(-50%,-50%) scale(.7)}67%{opacity:.95;transform:translate(-50%,-50%) scale(1.35)}73%{opacity:.65;transform:translate(-50%,-50%) scale(1.9)}}
@keyframes impactSpin{0%,62%,100%{opacity:0;transform:rotate(0deg)}67%{opacity:.65;transform:rotate(65deg)}80%{opacity:0;transform:rotate(130deg)}}
@keyframes flower{0%,100%{opacity:.3;transform:translate(-50%,-50%) scale(.8)}50%{opacity:.85;transform:translate(-50%,-50%) scale(1.2)}}
@keyframes rune{0%,100%{opacity:.35}50%{opacity:1}}
/* The same art is always above the controls: no cropped buttons on phones. */
@media(max-width:610px){body{padding:5px}.aura{border-radius:12px}.shell{border-radius:11px}.panel{display:flex;flex-direction:column;align-items:stretch;padding:12px 14px 14px;gap:12px}.heading{text-align:center}.kicker{font-size:8px}.track{font-size:10px}.controls{justify-content:center}.ctrl{width:42px;height:42px}.ctrl.primary{width:52px;height:52px}.progress{gap:8px}.time{min-width:29px;font-size:10px}.foot{justify-content:center}.vol{display:none}.status{text-align:center;font-size:9px}h1{font-size:clamp(14px,4.5vw,19px)} }
@media(max-width:350px){.panel{padding:11px 10px;gap:10px}h1{letter-spacing:.04em}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main aria-label="Lecteur audio La Reine des Cendres">
  <div class="aura" aria-hidden="true"></div>
  <div class="shell">
    <div class="art" aria-label="Duel d'Eiko et Aren, Obsidia et ROXOR">
      <img src="obsidia-duel-final.webp" alt="Eiko et Aren croisent leurs armes sous les emblèmes d’Obsidia et de ROXOR, la fleur de cristal bleu au centre" fetchpriority="high">
      <div class="impact" aria-hidden="true"></div>
      <div class="flower" aria-hidden="true"></div>
      <div class="rune" aria-hidden="true"></div>
      <canvas id="particles" class="sparks" aria-hidden="true"></canvas>
    </div>
    <section class="panel" aria-label="Commandes musicales">
      <div class="heading"><div class="kicker">Obsidia · Bande originale</div><h1>LA REINE DES CENDRES</h1><div class="track">Nothing to me...</div></div>
      <div class="controls">
        <button type="button" class="ctrl" id="restart" aria-label="Recommencer le morceau" title="Recommencer"><svg viewBox="0 0 24 24"><path d="M19 20V4M16 5 6 12l10 7V5Z"/></svg></button>
        <button type="button" class="ctrl primary" id="play" aria-label="Lire la musique" title="Lecture"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 4.5 20 12 8 19.5Z"/></svg></button>
        <button type="button" class="ctrl is-on" id="loop" aria-label="Désactiver la boucle" aria-pressed="true" title="Boucle activée"><svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>
      <div class="progress"><span class="time" id="elapsed">0:00</span><input id="seek" aria-label="Position dans la musique" type="range" min="0" max="1000" step="1" value="0"><span id="duration" class="time">0:00</span></div>
      <div class="foot"><label class="vol"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4 4a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></svg><input aria-label="Volume sonore" type="range" id="volume" min="0" max="100" value="80"></label><div class="status" id="status" role="status" aria-live="polite">PRÊT À ÉCOUTER · BOUCLE ACTIVE</div></div>
    </section>
    <audio id="audio" preload="metadata" loop src="episode2.mp3.mp3"></audio>
  </div>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), audio=$('audio'), play=$('play'), loop=$('loop'),seek=$('seek'),volume=$('volume'),status=$('status');
audio.loop=true;audio.volume=.8;
const fmt=n=>Number.isFinite(n)?`${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`:'0:00';
function progress(){ $('elapsed').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration);if(!seek.matches(':active'))seek.value=Number.isFinite(audio.duration)&&audio.duration>0?Math.round(audio.currentTime/audio.duration*1000):0;seek.style.setProperty('--percent',`${Number(seek.value)/10}%`); }
function sync(){const active=!audio.paused;document.body.classList.toggle('playing',active);$('playIcon').innerHTML=active?'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>':'<path d="M8 4.5 20 12 8 19.5Z"/>';play.title=active?'Pause':'Lecture';play.setAttribute('aria-label',active?'Mettre en pause':'Lire la musique');status.textContent=`${active?'EN LECTURE':'PRÊT À ÉCOUTER'} · ${audio.loop?'BOUCLE ACTIVE':'BOUCLE DÉSACTIVÉE'}`;}
play.addEventListener('click',async()=>{if(audio.paused){try{await audio.play()}catch(e){status.textContent='LECTURE IMPOSSIBLE — VÉRIFIER LE MP3';}}else{audio.pause();}sync()});
$('restart').addEventListener('click',()=>{audio.currentTime=0;progress()});
loop.addEventListener('click',()=>{audio.loop=!audio.loop;loop.classList.toggle('is-on',audio.loop);loop.setAttribute('aria-pressed',String(audio.loop));loop.setAttribute('aria-label',audio.loop?'Désactiver la boucle':'Activer la boucle');loop.title=audio.loop?'Boucle activée':'Boucle désactivée';sync()});
seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number(seek.value)/1000*audio.duration;seek.style.setProperty('--percent',`${Number(seek.value)/10}%`);progress()});
volume.addEventListener('input',()=>{audio.volume=Number(volume.value)/100;volume.style.setProperty('--percent',`${volume.value}%`)});
volume.style.setProperty('--percent','80%');
for(const event of ['timeupdate','durationchange','loadedmetadata','seeked'])audio.addEventListener(event,progress);
for(const event of ['play','pause','ended'])audio.addEventListener(event,sync);
audio.addEventListener('error',()=>{status.textContent='MUSIQUE INTROUVABLE — VÉRIFIER episode2.mp3.mp3'});
progress();sync();
// Tiny independently moving embers and energy sparks; original illustration remains unchanged.
const canvas=$('particles');if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
const ctx=canvas.getContext('2d');if(!ctx)return;
let w=0,h=0,items=[],rings=[],arcs=[],last=0,next=0,visible=true,burstUntil=0;
// Artwork impact coordinates are measured relative to the full panoramic banner.
const impactPoint=()=>({x:w*.531,y:h*.393});
const resize=()=>{const box=canvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);w=box.width;h=box.height;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)};
const rand=(lo,hi)=>lo+Math.random()*(hi-lo);
function spark(burst=false){
 const center=impactPoint(),angle=rand(0,Math.PI*2),speed=burst?rand(85,300):rand(6,27);
 items.push({x:burst?center.x:rand(0,w),y:burst?center.y:rand(0,h),px:0,py:0,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-(burst?0:12),age:0,life:burst?rand(.38,.95):rand(1.0,2.3),r:burst?rand(.9,2.1):rand(.3,1),blue:Math.random()>.52,burst});
 if(items.length>150)items.splice(0,items.length-150);
}
function startBurst(t){
 const p=impactPoint();burstUntil=t+670;
 rings.push({x:p.x,y:p.y,start:t});
 for(let i=0;i<60;i++)spark(true);
 for(let i=0;i<7;i++)arcs.push({start:t+rand(0,160),seed:Math.random(),angle:rand(0,Math.PI*2),len:rand(.10,.25)*Math.min(w,h),duration:rand(170,340)});
}
function drawRings(t){
 rings=rings.filter(r=>t-r.start<620);
 for(const r of rings){const q=(t-r.start)/620,rad=(12+Math.min(w,h)*.46*q);
 ctx.beginPath();ctx.arc(r.x,r.y,rad,0,Math.PI*2);
 ctx.strokeStyle=`rgba(167,232,255,${.75*(1-q)})`;ctx.lineWidth=2.5*(1-q)+.3;ctx.shadowColor='#74b7ff';ctx.shadowBlur=15;ctx.stroke();
 ctx.beginPath();ctx.arc(r.x,r.y,rad*.72,0,Math.PI*2);ctx.strokeStyle=`rgba(255,136,218,${.46*(1-q)})`;ctx.lineWidth=1.3;ctx.stroke();}
}
function drawArcs(t){
 arcs=arcs.filter(a=>t<a.start+a.duration);
 for(const a of arcs){if(t<a.start)continue;const q=(t-a.start)/a.duration,center=impactPoint(),theta=a.angle+q*.18;
 const endX=center.x+Math.cos(theta)*a.len,endY=center.y+Math.sin(theta)*a.len;
 for(let layer=0;layer<2;layer++){
 ctx.beginPath();ctx.moveTo(center.x,center.y);
 for(let k=1;k<7;k++){const f=k/7,offset=Math.sin((a.seed*20+k*7.2))*9*(1-f);ctx.lineTo(center.x+(endX-center.x)*f+Math.sin(theta+Math.PI/2)*offset,center.y+(endY-center.y)*f+Math.cos(theta+Math.PI/2)*offset)}
 ctx.lineTo(endX,endY);ctx.lineWidth=layer?1.3:5;ctx.strokeStyle=layer?`rgba(232,248,255,${1-q})`:`rgba(119,189,255,${.43*(1-q)})`;ctx.shadowBlur=layer?9:15;ctx.shadowColor=layer?'#ffffff':'#77b5ff';ctx.stroke();}
 }
}
function drawSparks(dt){
 for(let i=items.length-1;i>=0;i--){const p=items[i];p.age+=dt;if(p.age>=p.life){items.splice(i,1);continue}
 p.px=p.x;p.py=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.burst?155:4)*dt;p.vx*=1-dt*.7;
 const alpha=(1-p.age/p.life)*(p.burst?1:.46),c=p.blue?'130,213,255':'255,162,220';
 ctx.strokeStyle=`rgba(${c},${alpha})`;ctx.lineWidth=p.r;ctx.shadowBlur=p.burst?14:5;ctx.shadowColor=p.blue?'#6abfff':'#ff80dc';ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x+p.vx*dt*.7,p.y+p.vy*dt*.7);ctx.stroke();
 }
}
function frame(t){requestAnimationFrame(frame);if(!visible)return;const dt=Math.min((t-last)/1000||.016,.04);last=t;if(!w||!h)return;
 ctx.clearRect(0,0,w,h);if(Math.random()<.26)spark();if(!next)next=t+900;if(t>=next){startBurst(t);next=t+5100;}
 if(t<burstUntil){const q=1-(burstUntil-t)/670,center=impactPoint();ctx.save();ctx.globalCompositeOperation='screen';const g=ctx.createRadialGradient(center.x,center.y,0,center.x,center.y,Math.min(w,h)*.43);g.addColorStop(0,`rgba(255,250,255,${.6*(1-q)})`);g.addColorStop(.19,`rgba(255,130,220,${.42*(1-q)})`);g.addColorStop(.5,`rgba(64,132,255,${.13*(1-q)})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.restore()}
 drawRings(t);drawArcs(t);drawSparks(dt);ctx.shadowBlur=0;
}
resize();window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{visible=!document.hidden;last=0});requestAnimationFrame(frame);
})();
</script>
</body>
</html>
