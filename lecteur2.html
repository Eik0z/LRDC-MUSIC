<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Reine des Cendres — Lecteur Obsidia</title>
<style>
:root{color-scheme:dark;--pink:#ff4ba8;--cyan:#53cfff;--purple:#a96aff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:#f5eeff}
body{padding:26px 14px 34px;overflow-x:hidden}
.player{max-width:1000px;margin:auto;filter:drop-shadow(0 0 17px #5c2ead55)}
.duel{position:relative;aspect-ratio:1774/455;background:#090b19 url('duel-obsidia.webp') center/100% 100% no-repeat;overflow:hidden;border:1px solid #7d4bdd;border-bottom:none;border-radius:20px 20px 0 0;isolation:isolate}
.duel:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 12%,#b461ff1a 38%,#fff2 52%,#4fd5ff1a 64%,transparent 90%);animation:breath 4s ease-in-out infinite;pointer-events:none}
.clash{position:absolute;left:52.2%;top:51%;width:7%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.7);pointer-events:none;background:radial-gradient(circle,#fff9 0%,#ffd5ff99 12%,#ff87b755 24%,transparent 65%);mix-blend-mode:screen;animation:clash 3s ease-in-out infinite}
.sparks{position:absolute;left:52.2%;top:51%;width:2px;height:2px;pointer-events:none;box-shadow:0 -30px 4px 1px #ffe4a6,28px -15px 3px #ffc0f9,-35px 18px 3px #52d4ff,32px 29px 3px #fff5cc,-27px -26px 3px #f88aff;animation:sparks 3s ease-out infinite}
@keyframes clash{0%,72%,100%{opacity:.25;transform:translate(-50%,-50%) scale(.6)}80%{opacity:1;transform:translate(-50%,-50%) scale(1.5)}89%{opacity:.5;transform:translate(-50%,-50%) scale(.85)}}
@keyframes sparks{0%,72%,100%{opacity:.2;transform:scale(.7)}80%{opacity:1;transform:scale(1.8)}92%{opacity:0;transform:scale(3)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.85}}
.deck{position:relative;background:linear-gradient(145deg,#10101f 0%,#090919 50%,#0a1122 100%);padding:22px clamp(16px,3.5vw,37px) 24px;border:2px solid #a66bfc;border-top:2px solid #f257af;border-radius:0 0 24px 24px;box-shadow:inset 0 0 24px #451c8055,0 0 20px #894dfa66;overflow:hidden}
.deck:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(90deg,transparent,#4de2ff33,transparent,#ff59b633,transparent);background-size:200% 100%;animation:shine 7s linear infinite;opacity:.55}
@keyframes shine{to{background-position:200% 0}}
.brand,.track,.controls,.timeline,.bottom{position:relative;z-index:1}
.brand{text-align:center;font-family:Georgia,serif;letter-spacing:.19em;font-size:clamp(15px,2.6vw,26px);text-shadow:0 0 17px #d757ff,0 0 30px #8c2aff;margin:0 0 7px}
.track{text-align:center;color:#b8afd2;letter-spacing:.08em;font-size:12px;margin-bottom:17px}
.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:16px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.iconbtn{height:38px;min-width:38px;border:1px solid #7f6aab;background:#1b1933bb;color:#f7edff;border-radius:12px;font-size:18px;transition:.2s;box-shadow:inset 0 0 8px #8144ef44}
.iconbtn:hover,.iconbtn:focus-visible{border-color:#68ddff;box-shadow:0 0 12px #46cfff66;outline:none}
.iconbtn.active{color:white;border-color:#ff72ca;background:#6b225f88;box-shadow:0 0 14px #ff48b777}
.play{height:59px;width:59px;border-radius:50%;font-size:23px;border:2px solid #ff86cf;color:white;background:radial-gradient(circle,#4b164d,#170e2c);box-shadow:0 0 16px #f759bb99,inset 0 0 13px #ff57b755}
.timeline,.bottom{display:flex;align-items:center;gap:12px}
.timeline span{min-width:40px;text-align:center;font-variant-numeric:tabular-nums;color:#d3cce4;font-size:12px}
input[type=range]{accent-color:#b975ff;cursor:pointer;min-width:0}
#seek{flex:1;width:100%;height:20px}
.bottom{margin-top:10px;justify-content:space-between;flex-wrap:wrap;gap:10px}
.volume{display:flex;gap:9px;align-items:center;color:#b9b3dc;font-size:13px}.volume input{width:120px}
.status{font-size:11px;color:#a9b1d4;letter-spacing:.05em}
.live-dot{display:inline-block;width:6px;height:6px;margin-right:7px;background:#b56cff;border-radius:50%;box-shadow:0 0 7px #ba6bff}
@media(max-width:460px){body{padding:18px 7px 20px}.deck{padding:16px 12px 18px}.controls{gap:10px}.volume input{width:75px}.brand{letter-spacing:.08em}.duel{border-radius:12px 12px 0 0}.status{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<main class="player" aria-label="Lecteur audio de La Reine des Cendres">
 <section class="duel" role="img" aria-label="Eiko et Aren s'affrontent dans Obsidia">
  <span class="clash"></span><span class="sparks"></span>
 </section>
 <section class="deck">
  <h1 class="brand">LA REINE DES CENDRES</h1>
  <div class="track">Nothing to me...</div>
  <div class="controls">
   <button id="restart" class="iconbtn" type="button" aria-label="Recommencer le morceau" title="Recommencer">⏮</button>
   <button id="play" class="play" type="button" aria-label="Lecture">▶</button>
   <button id="loop" class="iconbtn active" type="button" aria-label="Boucle activée" aria-pressed="true" title="Boucle activée">↻</button>
  </div>
  <div class="timeline"><span id="current">0:00</span><input id="seek" aria-label="Progression de la musique" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div>
  <div class="bottom"><div class="volume"><span aria-hidden="true">🔊</span><input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume"></div><div class="status"><span class="live-dot"></span><span id="state">PRÊT À ÉCOUTER · BOUCLE ACTIVE</span></div></div>
  <audio id="audio" preload="metadata" loop src="episode2.mp3.mp3"></audio>
 </section>
</main>
<script>
(() => {
 const audio=document.getElementById('audio'),play=document.getElementById('play'),loop=document.getElementById('loop'),restart=document.getElementById('restart'),seek=document.getElementById('seek'),volume=document.getElementById('volume'),current=document.getElementById('current'),duration=document.getElementById('duration'),state=document.getElementById('state');
 audio.volume=.8; audio.loop=true;
 const fmt=t=>Number.isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00';
 const update=()=>{current.textContent=fmt(audio.currentTime);duration.textContent=fmt(audio.duration);seek.value=Number.isFinite(audio.duration)&&audio.duration>0?Math.round(audio.currentTime/audio.duration*1000):0};
 const sync=()=>{const active=!audio.paused;play.textContent=active?'❚❚':'▶';play.setAttribute('aria-label',active?'Pause':'Lecture');state.textContent=active?'LECTURE EN COURS · '+(audio.loop?'BOUCLE ACTIVE':'BOUCLE DÉSACTIVÉE'):'PRÊT À ÉCOUTER · '+(audio.loop?'BOUCLE ACTIVE':'BOUCLE DÉSACTIVÉE')};
 play.addEventListener('click',async()=>{if(audio.paused){try{await audio.play()}catch(e){state.textContent='IMPOSSIBLE DE LIRE LE FICHIER AUDIO'}}else{audio.pause()}sync()});
 restart.addEventListener('click',()=>{audio.currentTime=0;update()});
 loop.addEventListener('click',()=>{audio.loop=!audio.loop;loop.classList.toggle('active',audio.loop);loop.setAttribute('aria-pressed',String(audio.loop));loop.setAttribute('aria-label',audio.loop?'Boucle activée':'Boucle désactivée');loop.title=audio.loop?'Boucle activée':'Boucle désactivée';sync()});
 volume.addEventListener('input',()=>audio.volume=Number(volume.value)/100);
 seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration)) audio.currentTime=Number(seek.value)/1000*audio.duration;update()});
 for(const evt of ['timeupdate','loadedmetadata','durationchange','seeked']) audio.addEventListener(evt,update);
 for(const evt of ['play','pause','ended']) audio.addEventListener(evt,sync);
 audio.addEventListener('error',()=>state.textContent='FICHIER AUDIO INTROUVABLE OU NON LISIBLE');
 sync();update();
})();
</script>
</body>
</html>
