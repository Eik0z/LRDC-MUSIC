<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><style>
body{margin:0;padding:88px 42px 58px;background:transparent;font-family:'Segoe UI',sans-serif;overflow:hidden}
.stage{position:relative;max-width:600px;margin:auto}
.neon{position:relative;border-radius:50px;padding:3px;overflow:hidden;box-shadow:0 0 22px rgba(139,92,246,.55),0 0 40px rgba(56,189,248,.3)}
.neon::before{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(transparent,#a855f7,#38bdf8,transparent 40%,transparent 50%,#f59e0b,#38bdf8,transparent 90%);animation:rot 4s linear infinite;z-index:0}
.neon.play::before{animation-duration:1.8s}@keyframes rot{100%{transform:rotate(360deg)}}
.bar{position:relative;z-index:1;display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#090910,#150e24 50%,#0a1420);border-radius:47px;padding:6px 16px}
.info{display:flex;align-items:center;gap:8px;white-space:nowrap;color:#38bdf8;font-size:13px;font-weight:bold;text-shadow:0 0 8px rgba(56,189,248,.7)}
.btn{font-size:11px;color:#38bdf8;background:rgba(56,189,248,.15);padding:3px 9px;border-radius:12px;border:1px solid #38bdf8;cursor:pointer;font-weight:bold}
.btn.off{color:#94a3b8;background:rgba(148,163,184,.1);border-color:#475569;font-weight:normal}
audio{flex:1;height:30px;filter:invert(90%) hue-rotate(180deg);outline:none}
.w{position:absolute;width:46px;height:52px;z-index:10;pointer-events:none;offset-path:inset(-24px -26px -24px -26px round 60px);offset-rotate:auto;offset-anchor:50% 92%;animation:walk 24s linear infinite}
.w1{animation-delay:0s}.w2{animation-delay:-6s}.w3{animation-delay:-12s}.w4{animation-delay:-18s}
.play .w{animation-duration:14s}.play .w1{animation-delay:0s}.play .w2{animation-delay:-3.5s}.play .w3{animation-delay:-7s}.play .w4{animation-delay:-10.5s}
@keyframes walk{100%{offset-distance:100%}}
.ll{transform-origin:23px 35px;animation:sw .45s ease-in-out infinite alternate}
.lr{transform-origin:23px 35px;animation:sw .45s ease-in-out infinite alternate-reverse}
.al{transform-origin:23px 24px;animation:sw .45s ease-in-out infinite alternate-reverse}
.hf{transform-origin:20px 14px;animation:hw .6s ease-in-out infinite alternate}
.bb{animation:bob .225s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes hw{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
</style></head><body><div class="stage" id="st">

<div class="neon" id="nb"><div class="bar"><div class="info"><span>Nothing to me...</span><button id="lb" class="btn" onclick="tg()">🔁 Boucle : ON</button></div><audio id="pl" controls><source src="episode2.mp3.mp3" type="audio/mpeg"></audio></div></div>
</div><script>
let lp=true;const pl=document.getElementById('pl'),lb=document.getElementById('lb'),nb=document.getElementById('nb'),st=document.getElementById('st');
function tg(){lp=!lp;lb.innerText=lp?'🔁 Boucle : ON':'🔁 Boucle : OFF';lb.classList.toggle('off',!lp)}
pl.onplay=()=>{nb.classList.add('play');st.classList.add('play')};pl.onpause=()=>{nb.classList.remove('play');st.classList.remove('play')};
pl.onended=()=>{if(lp){pl.currentTime=0;pl.play()}else{nb.classList.remove('play');st.classList.remove('play')}};
</script></body></html>
