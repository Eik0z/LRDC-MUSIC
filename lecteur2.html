<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Reine des Cendres — Lecteur Obsidia / ROXOR</title>
<style>
:root{color-scheme:dark;--violet:#ad79ff;--pink:#ff63b8;--ice:#8bdaff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;background:#000;color:#f5eaff;font-family:Segoe UI,Arial,sans-serif}
body{padding:3px;overflow-x:hidden}
.player{width:100%;max-width:1180px;margin:auto;min-height:146px;display:grid;grid-template-columns:minmax(240px,42%) minmax(0,1fr);background:#080615;border:1px solid #9b61cf;border-radius:12px;box-shadow:inset 0 0 20px #7c37a42c,0 0 10px #9c51ca44;overflow:hidden;isolation:isolate}
.art{position:relative;overflow:hidden;min-height:144px;background:#03020b;border-right:1px solid #a35fd2}
.art img{display:block;width:100%;height:100%;min-height:144px;object-fit:contain;object-position:center;background:#080511;animation:breath 8s ease-in-out infinite alternate;will-change:transform}
.art::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#330b3f18,transparent 30%,#400c3415),linear-gradient(0deg,#04020e55,transparent 30%)}
.art .glow{position:absolute;width:24%;aspect-ratio:1;top:42%;left:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff8 0%,#fda7fc70 7%,#66bbff36 21%,transparent 70%);mix-blend-mode:screen;animation:charge 4.7s infinite;pointer-events:none}
.art .ring{position:absolute;top:42%;left:50%;width:7%;aspect-ratio:1;border:1px solid #f2ceff;border-radius:50%;box-shadow:0 0 8px #cf83ff;animation:ring 4.7s infinite;pointer-events:none}
.art canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.interface{position:relative;padding:13px 18px 10px;display:flex;flex-direction:column;justify-content:center;gap:8px;background:radial-gradient(ellipse at top right,#3d104053,transparent 57%),linear-gradient(120deg,#10091f,#080c1c)}
.interface::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 35%,#b97eff15 49%,transparent 62%);background-size:220% 100%;animation:sweep 11s linear infinite}
.heading,.transport,.progress,.footer{position:relative;z-index:1}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title-wrap{min-width:0}
h1{font:600 clamp(13px,1.7vw,19px) Georgia,serif;letter-spacing:.09em;margin:0;text-shadow:0 0 9px #ba69fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{margin-top:3px;color:#cbbbe8;font-size:11px;letter-spacing:.06em}
.transport{display:flex;align-items:center;justify-content:center;gap:13px}
button{cursor:pointer;color:#fff;font-family:inherit;touch-action:manipulation}
.button{height:29px;min-width:37px;border:1px solid #8464a7;border-radius:7px;background:#251536;font-size:18px;display:grid;place-items:center}
.button.on{border-color:var(--pink);background:#5c2258;box-shadow:0 0 12px #f46bcd88}
.button.play{height:38px;min-width:45px;border:1px solid #ff85d3;border-radius:100px;background:linear-gradient(130deg,#7d276e,#281942);font-size:21px;box-shadow:0 0 12px #e85cbb88}
button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.progress{display:flex;gap:9px;align-items:center}
.time{width:32px;text-align:center;font-size:10px;font-variant-numeric:tabular-nums;color:#e4dff0;flex-shrink:0}
input[type=range]{min-width:0;accent-color:#d379ff;cursor:pointer}
#seek{flex:1;width:100%;height:13px}
.footer{display:flex;align-items:center;justify-content:space-between;gap:12px}
.volume{display:flex;align-items:center;gap:6px;color:#ddd2ed;font-size:12px}
#volume{width:84px}
.status{color:#aa9dbc;font-size:10px;letter-spacing:.025em;text-align:right}
.status::before{content:"";display:inline-block;width:5px;height:5px;background:#a56bff;border-radius:50%;box-shadow:0 0 7px #cf76ff;margin-right:6px;vertical-align:middle}
@keyframes breath{from{transform:scale(1)}to{transform:scale(1.035)}}
@keyframes charge{0%,58%,100%{opacity:.1;transform:translate(-50%,-50%) scale(.6)}66%{opacity:.85;transform:translate(-50%,-50%) scale(1.3)}75%{opacity:.12;transform:translate(-50%,-50%) scale(1)}}
@keyframes ring{0%,59%,100%{opacity:0;transform:translate(-50%,-50%) scale(.3)}66%{opacity:1}80%{opacity:0;transform:translate(-50%,-50%) scale(5)}}
@keyframes sweep{to{background-position:220% 0}}
@media(max-width:700px){.player{grid-template-columns:minmax(180px,40%) minmax(0,1fr)}.interface{padding:9px 12px;gap:6px}.art,.art img{min-height:140px}.title-wrap h1{font-size:clamp(11px,2.1vw,15px);letter-spacing:.025em}.subtitle{font-size:10px}.transport{gap:8px}.button{min-width:31px;height:26px}.button.play{min-width:39px;height:34px}.footer{gap:4px}.status{font-size:9px}#volume{width:54px}}
/* Mobile: compact horizontal layout to fit a short Google Sites iframe */
@media(max-width:540px){
 body{padding:2px}
 .player{display:grid;grid-template-columns:minmax(78px,34%) minmax(0,1fr);height:146px;min-height:0;max-height:146px;border-radius:10px}
 .art{height:144px;min-height:0;border-right:1px solid #a35fd2;border-bottom:0;aspect-ratio:auto}
 .art img{width:100%;height:100%;min-height:0;object-fit:cover;object-position:center center}
 .interface{padding:7px 9px;gap:6px;min-width:0;justify-content:center}
 .heading{min-width:0;min-height:0;padding:0;display:block}
 .heading h1{font-size:clamp(10px,2.8vw,13px);line-height:1.25;letter-spacing:.015em}
 .subtitle{margin-top:2px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .transport{position:relative;right:auto;top:auto;justify-content:center;gap:12px}
 .button{height:28px;min-width:34px;font-size:17px}
 .button.play{height:32px;min-width:40px;font-size:19px}
 .progress{gap:4px;min-width:0}
 .time{width:28px;font-size:9px}
 #seek{height:20px}
 .footer{min-height:13px;gap:0;justify-content:center}
 .footer .volume{display:none}
 .status{font-size:9px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
@media(max-width:350px){
 .player{grid-template-columns:minmax(70px,30%) minmax(0,1fr)}
 .interface{padding:6px;gap:7px}
 .transport{gap:7px}
 .heading h1{font-size:11px}
 .button{min-width:31px}
 .button.play{min-width:37px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<!-- Google Sites: keep embed at least 155-170px tall on mobile and desktop. -->
<main class="player" aria-label="Lecteur audio La Reine des Cendres">
  <section class="art" aria-label="Duel Eiko et Aren, drapeaux Obsidia et ROXOR">
    <img src="duel-obsidia-v3.webp" alt="Eiko et Aren se battent, sous les drapeaux d'Obsidia et de ROXOR">
    <div class="glow" aria-hidden="true"></div><div class="ring" aria-hidden="true"></div>
    <canvas id="sparks" aria-hidden="true"></canvas>
  </section>
  <section class="interface">
    <div class="heading"><div class="title-wrap"><h1>LA REINE DES CENDRES</h1><div class="subtitle">Nothing to me...</div></div></div>
    <div class="transport">
      <button id="restart" class="button" title="Recommencer" aria-label="Recommencer">⏮</button>
      <button id="play" class="button play" title="Lecture" aria-label="Lecture">▶</button>
      <button id="loop" class="button on" title="Boucle activée" aria-label="Boucle activée" aria-pressed="true">↻</button>
    </div>
    <div class="progress"><span id="elapsed" class="time">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Avancement dans la musique"><span id="duration" class="time">0:00</span></div>
    <div class="footer"><label class="volume">🔊 <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume"></label><div id="status" class="status" role="status">BOUCLE ACTIVE</div></div>
  </section>
  <audio id="audio" preload="metadata" loop src="episode2.mp3.mp3"></audio>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id),audio=$('audio'),play=$('play'),loop=$('loop'),seek=$('seek'),vol=$('volume'),status=$('status');
 audio.loop=true;audio.volume=.8;
 const format=n=>Number.isFinite(n)?`${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`:'0:00';
 function update(){ $('elapsed').textContent=format(audio.currentTime);$('duration').textContent=format(audio.duration);if(document.activeElement!==seek)seek.value=Number.isFinite(audio.duration)&&audio.duration>0?Math.round(audio.currentTime/audio.duration*1000):0; }
 function sync(){let p=!audio.paused;play.textContent=p?'Ⅱ':'▶';play.title=p?'Pause':'Lecture';play.setAttribute('aria-label',play.title);status.textContent=(p?'EN LECTURE':'PRÊT')+' · '+(audio.loop?'BOUCLE ACTIVE':'BOUCLE DÉSACTIVÉE');}
 play.onclick=async()=>{if(audio.paused){try{await audio.play()}catch(e){status.textContent='LECTURE IMPOSSIBLE : VÉRIFIER LE MP3';}}else audio.pause();sync()};
 $('restart').onclick=()=>{audio.currentTime=0;update()};
 loop.onclick=()=>{audio.loop=!audio.loop;loop.classList.toggle('on',audio.loop);loop.setAttribute('aria-pressed',String(audio.loop));loop.setAttribute('aria-label',audio.loop?'Boucle activée':'Boucle désactivée');loop.title=audio.loop?'Boucle activée':'Boucle désactivée';sync()};
 vol.oninput=()=>audio.volume=Number(vol.value)/100;
 seek.oninput=()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number(seek.value)/1000*audio.duration;update()};
 for(const ev of ['timeupdate','loadedmetadata','durationchange','seeked'])audio.addEventListener(ev,update);
 for(const ev of ['play','pause','ended'])audio.addEventListener(ev,sync);
 audio.addEventListener('error',()=>status.textContent='MP3 INTROUVABLE');sync();update();
 // Sparks on image only. No flashing or resizing of the full embedded player.
 const canvas=$('sparks'),ctx=canvas.getContext('2d');if(!ctx||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 let w=0,h=0,particles=[],last=0,nextBurst=0;
 function size(){const r=canvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}
 function add(burst){const a=Math.random()*Math.PI*2,s=burst?35+Math.random()*105:2+Math.random()*13;particles.push({x:burst?w*.5:Math.random()*w,y:burst?h*.42:Math.random()*h,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(burst?0:8),life:burst?.3+Math.random()*.8:1+Math.random()*3,age:0,r:burst?1+Math.random()*1.6:.6+Math.random(),color:Math.random()<.5?'255,170,235':'133,213,255'});if(particles.length>110)particles.shift()}
 function draw(t){const dt=Math.min((t-last)/1000||.016,.045);last=t;ctx.clearRect(0,0,w,h);if(Math.random()<.5)add(false);if(t>nextBurst){nextBurst=t+4700;for(let i=0;i<27;i++)add(true)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=dt;if(p.age>=p.life){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<1.2)p.vy+=90*dt;const alpha=(1-p.age/p.life)*.9;ctx.fillStyle=`rgba(${p.color},${alpha})`;ctx.shadowColor=`rgba(${p.color},${alpha})`;ctx.shadowBlur=6;ctx.fillRect(p.x,p.y,p.r,p.r*1.8)}ctx.shadowBlur=0;requestAnimationFrame(draw)}
 size();window.addEventListener('resize',size);requestAnimationFrame(draw);
})();
</script>
</body>
</html>
