<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Reine des Cendres — Lecteur Obsidia / ROXOR</title>
<style>
:root{color-scheme:dark;--violet:#ae7bff;--pink:#ff69c5;--ice:#89dfff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;background:#000;color:#f8eeff;font-family:Segoe UI,Arial,sans-serif}
body{padding:4px;overflow-x:hidden}
.player{width:100%;max-width:1160px;margin:0 auto;display:flex;flex-direction:column;background:#090615;border:1px solid #9456cb;border-radius:14px;overflow:hidden;isolation:isolate;box-shadow:0 0 12px #9951da6e,inset 0 0 18px #6b228c2b}
.art{position:relative;width:100%;height:clamp(110px,16vw,175px);background:#04030b;border-bottom:1px solid #8044be;overflow:hidden;flex:none}
.art img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#03020a;animation:breath 9s ease-in-out infinite alternate}
.art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#4b08701a,transparent 35%,#380c6518),linear-gradient(0deg,#02010663,transparent 45%);pointer-events:none}
.art .glow{position:absolute;width:14%;aspect-ratio:1;top:48%;left:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fff9 0%,#fda7fc7a 8%,#5cb0ff36 23%,transparent 70%);mix-blend-mode:screen;animation:charge 4.7s infinite;pointer-events:none}
.art .ring{position:absolute;top:48%;left:50%;width:4%;aspect-ratio:1;border:1px solid #f2ceff;border-radius:50%;box-shadow:0 0 8px #cf83ff;animation:ring 4.7s infinite;pointer-events:none}
.art canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.interface{position:relative;padding:12px clamp(12px,3vw,30px) 10px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'heading transport' 'progress progress' 'footer footer';gap:8px 22px;background:radial-gradient(ellipse at top right,#5c155147,transparent 58%),linear-gradient(120deg,#10091e,#090d1b)}
.interface::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 38%,#ad7bff12 50%,transparent 64%);background-size:220% 100%;animation:sweep 11s linear infinite}
.heading,.transport,.progress,.footer{position:relative;z-index:1;min-width:0}
.heading{grid-area:heading;align-self:center}
.title-wrap{min-width:0}
h1{font:600 clamp(13px,1.7vw,19px) Georgia,serif;letter-spacing:.07em;margin:0;text-shadow:0 0 9px #ba69fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{margin-top:3px;color:#cbbbe8;font-size:11px}
.transport{grid-area:transport;display:flex;align-items:center;justify-content:center;gap:12px}
button{cursor:pointer;color:#fff;font-family:inherit;touch-action:manipulation}
.button{height:35px;min-width:42px;border:1px solid #8864ad;border-radius:8px;background:#251536;font-size:19px;display:grid;place-items:center}
.button.on{border-color:var(--pink);background:#572154;box-shadow:0 0 11px #f46bcd88}
.button.play{height:42px;min-width:49px;border:1px solid #ff85d3;border-radius:100px;background:linear-gradient(130deg,#7d276e,#281942);font-size:22px;box-shadow:0 0 12px #e85cbb88}
button:focus-visible,input:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.progress{grid-area:progress;display:flex;gap:10px;align-items:center}
.time{width:36px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums;color:#e4dff0;flex-shrink:0}
input[type=range]{min-width:0;accent-color:#d379ff;cursor:pointer}
#seek{flex:1;width:100%;height:18px}
.footer{grid-area:footer;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:22px}
.volume{display:flex;align-items:center;gap:6px;color:#ddd2ed;font-size:12px}
#volume{width:90px}
.status{color:#b8a9d2;font-size:10px;letter-spacing:.035em;text-align:right}
.status::before{content:"";display:inline-block;width:5px;height:5px;background:#a56bff;border-radius:50%;box-shadow:0 0 7px #cf76ff;margin-right:6px;vertical-align:middle}
@keyframes breath{from{transform:scale(1)}to{transform:scale(1.03)}}
@keyframes charge{0%,58%,100%{opacity:.1;transform:translate(-50%,-50%) scale(.6)}66%{opacity:.85;transform:translate(-50%,-50%) scale(1.3)}75%{opacity:.12;transform:translate(-50%,-50%) scale(1)}}
@keyframes ring{0%,59%,100%{opacity:0;transform:translate(-50%,-50%) scale(.3)}66%{opacity:1}80%{opacity:0;transform:translate(-50%,-50%) scale(5)}}
@keyframes sweep{to{background-position:220% 0}}
/* Une seule mise en page : image en haut, commandes dessous, sur TOUS les écrans. */
@media(max-width:600px){
 body{padding:3px}
 .player{border-radius:11px}
 .art{height:auto;aspect-ratio:2146/652;min-height:0;max-height:150px}
 .art img{height:100%;object-fit:contain}
 .interface{display:flex;flex-direction:column;align-items:stretch;gap:9px;padding:11px 12px 13px}
 .heading{text-align:center}
 h1{font-size:clamp(13px,3.8vw,17px);letter-spacing:.035em}
 .subtitle{font-size:11px}
 .transport{gap:18px}
 .button{height:38px;min-width:44px}
 .button.play{height:46px;min-width:54px}
 .progress{gap:6px}
 .time{width:33px;font-size:10px}
 .footer{justify-content:center;min-height:15px}
 .volume{display:none}
 .status{text-align:center;font-size:10px}
}
@media(max-width:340px){.interface{padding:10px 8px;gap:8px}.transport{gap:14px}h1{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<!-- Google Sites : cadre conseille de 330 a 360px de haut pour afficher la version PC ET mobile sans couper les commandes. -->
<main class="player" aria-label="Lecteur audio La Reine des Cendres">
  <section class="art" aria-label="Duel Eiko et Aren, drapeaux Obsidia et ROXOR">
    <img src="duel-obsidia-v3.webp" alt="Eiko et Aren se battent, sous les drapeaux d'Obsidia et de ROXOR">
    <div class="glow" aria-hidden="true"></div><div class="ring" aria-hidden="true"></div>
    <canvas id="sparks" aria-hidden="true"></canvas>
  </section>
  <section class="interface">
    <div class="heading"><div class="title-wrap"><h1>LA REINE DES CENDRES</h1><div class="subtitle">Nothing to me...</div></div></div>
    <div class="transport">
      <button id="restart" class="button" title="Recommencer" aria-label="Recommencer">⏮</button>
      <button id="play" class="button play" title="Lecture" aria-label="Lecture">▶</button>
      <button id="loop" class="button on" title="Boucle activée" aria-label="Boucle activée" aria-pressed="true">↻</button>
    </div>
    <div class="progress"><span id="elapsed" class="time">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Avancement dans la musique"><span id="duration" class="time">0:00</span></div>
    <div class="footer"><label class="volume">🔊 <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volume"></label><div id="status" class="status" role="status">BOUCLE ACTIVE</div></div>
  </section>
  <audio id="audio" preload="metadata" loop src="episode2.mp3.mp3"></audio>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id),audio=$('audio'),play=$('play'),loop=$('loop'),seek=$('seek'),vol=$('volume'),status=$('status');
 audio.loop=true;audio.volume=.8;
 const format=n=>Number.isFinite(n)?`${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}`:'0:00';
 function update(){ $('elapsed').textContent=format(audio.currentTime);$('duration').textContent=format(audio.duration);if(document.activeElement!==seek)seek.value=Number.isFinite(audio.duration)&&audio.duration>0?Math.round(audio.currentTime/audio.duration*1000):0; }
 function sync(){let p=!audio.paused;play.textContent=p?'Ⅱ':'▶';play.title=p?'Pause':'Lecture';play.setAttribute('aria-label',play.title);status.textContent=(p?'EN LECTURE':'PRÊT')+' · '+(audio.loop?'BOUCLE ACTIVE':'BOUCLE DÉSACTIVÉE');}
 play.onclick=async()=>{if(audio.paused){try{await audio.play()}catch(e){status.textContent='LECTURE IMPOSSIBLE : VÉRIFIER LE MP3';}}else audio.pause();sync()};
 $('restart').onclick=()=>{audio.currentTime=0;update()};
 loop.onclick=()=>{audio.loop=!audio.loop;loop.classList.toggle('on',audio.loop);loop.setAttribute('aria-pressed',String(audio.loop));loop.setAttribute('aria-label',audio.loop?'Boucle activée':'Boucle désactivée');loop.title=audio.loop?'Boucle activée':'Boucle désactivée';sync()};
 vol.oninput=()=>audio.volume=Number(vol.value)/100;
 seek.oninput=()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number(seek.value)/1000*audio.duration;update()};
 for(const ev of ['timeupdate','loadedmetadata','durationchange','seeked'])audio.addEventListener(ev,update);
 for(const ev of ['play','pause','ended'])audio.addEventListener(ev,sync);
 audio.addEventListener('error',()=>status.textContent='MP3 INTROUVABLE');sync();update();
 // Sparks on image only. No flashing or resizing of the full embedded player.
 const canvas=$('sparks'),ctx=canvas.getContext('2d');if(!ctx||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 let w=0,h=0,particles=[],last=0,nextBurst=0;
 function size(){const r=canvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}
 function add(burst){const a=Math.random()*Math.PI*2,s=burst?35+Math.random()*105:2+Math.random()*13;particles.push({x:burst?w*.5:Math.random()*w,y:burst?h*.48:Math.random()*h,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(burst?0:8),life:burst?.3+Math.random()*.8:1+Math.random()*3,age:0,r:burst?1+Math.random()*1.6:.6+Math.random(),color:Math.random()<.5?'255,170,235':'133,213,255'});if(particles.length>110)particles.shift()}
 function draw(t){const dt=Math.min((t-last)/1000||.016,.045);last=t;ctx.clearRect(0,0,w,h);if(Math.random()<.5)add(false);if(t>nextBurst){nextBurst=t+4700;for(let i=0;i<27;i++)add(true)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=dt;if(p.age>=p.life){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<1.2)p.vy+=90*dt;const alpha=(1-p.age/p.life)*.9;ctx.fillStyle=`rgba(${p.color},${alpha})`;ctx.shadowColor=`rgba(${p.color},${alpha})`;ctx.shadowBlur=6;ctx.fillRect(p.x,p.y,p.r,p.r*1.8)}ctx.shadowBlur=0;requestAnimationFrame(draw)}
 size();window.addEventListener('resize',size);requestAnimationFrame(draw);
})();
</script>
</body>
</html>
