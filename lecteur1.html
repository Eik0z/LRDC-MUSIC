<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 6px; background: transparent; font-family: 'Segoe UI', sans-serif; }
  .mini-bar { display: flex; align-items: center; gap: 12px; background: linear-gradient(90deg, #0b0b14 0%, #1a102e 50%, #0d1b2a 100%); border: 1px solid #8b5cf6; box-shadow: 0 0 12px rgba(139, 92, 246, 0.4); border-radius: 50px; padding: 6px 16px; max-width: 650px; margin: auto; }
  .track-info { display: flex; align-items: center; gap: 8px; white-space: nowrap; color: #38bdf8; font-size: 13px; font-weight: bold; text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
  .loop-btn { font-size: 11px; color: #38bdf8; background: rgba(56, 189, 248, 0.2); padding: 3px 9px; border-radius: 12px; border: 1px solid #38bdf8; cursor: pointer; font-weight: bold; transition: 0.2s; }
  .loop-btn.off { color: #94a3b8; background: rgba(148, 163, 184, 0.1); border-color: #475569; font-weight: normal; }
  audio { flex: 1; height: 30px; filter: invert(90%) hue-rotate(180deg); outline: none; }
</style>
</head>
<body>

<div class="mini-bar">
  <div class="track-info">
    <span>🌑 Underworld</span>
    <button id="loopBtn" class="loop-btn" onclick="toggleLoop()">🔁 Boucle : ON</button>
  </div>
  <audio id="player" controls>
    <source src="episode3.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
  let isLooping = true;
  const player = document.getElementById('player');
  const loopBtn = document.getElementById('loopBtn');

  function toggleLoop() {
    isLooping = !isLooping;
    loopBtn.innerText = isLooping ? '🔁 Boucle : ON' : '🔁 Boucle : OFF';
    loopBtn.classList.toggle('off', !isLooping);
  }

  player.addEventListener('ended', function() {
    if (isLooping) {
      player.currentTime = 0;
      player.play();
    }
  });
</script>

</body>
</html>
