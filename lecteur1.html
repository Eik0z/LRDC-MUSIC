<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 42px 26px 24px 26px;
    background: transparent;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  .player-stage {
    position: relative;
    max-width: 620px;
    margin: auto;
  }

  /* Bordure néon tournante */
  .neon-wrapper {
    position: relative;
    border-radius: 50px;
    padding: 3px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(139, 92, 246, 0.5), 0 0 35px rgba(56, 189, 248, 0.25);
  }

  .neon-wrapper::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(transparent, #a855f7, #38bdf8, transparent 40%, transparent 50%, #f59e0b, #38bdf8, transparent 90%);
    animation: rotateNeon 4s linear infinite;
    z-index: 0;
  }

  .neon-wrapper.playing::before {
    animation-duration: 1.8s;
  }

  @keyframes rotateNeon {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Intérieur du lecteur */
  .mini-bar {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(90deg, #090910 0%, #150e24 50%, #0a1420 100%);
    border-radius: 47px;
    padding: 6px 16px;
  }

  .track-info {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    color: #38bdf8;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
  }

  .loop-btn {
    font-size: 11px;
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.15);
    padding: 3px 9px;
    border-radius: 12px;
    border: 1px solid #38bdf8;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
  }

  .loop-btn.off {
    color: #94a3b8;
    background: rgba(148, 163, 184, 0.1);
    border-color: #475569;
    font-weight: normal;
  }

  audio {
    flex: 1;
    height: 30px;
    filter: invert(90%) hue-rotate(180deg);
    outline: none;
  }

  /* --- CHIBIS EIKO & CAROL QUI MARCHENT AUTOUR --- */
  .walker {
    position: absolute;
    width: 34px;
    height: 40px;
    z-index: 10;
    pointer-events: none;
    offset-path: inset(-34px -16px -16px -16px round 50px);
    offset-rotate: auto;
    animation: patrol 16s linear infinite;
  }

  .walker-carol {
    animation-delay: -8s;
  }

  .playing .walker {
    animation-duration: 9s;
  }

  @keyframes patrol {
    0%   { offset-distance: 0%; }
    100% { offset-distance: 100%; }
  }

  .leg-l { transform-origin: 17px 26px; animation: swing 0.45s ease-in-out infinite alternate; }
  .leg-r { transform-origin: 17px 26px; animation: swing 0.45s ease-in-out infinite alternate-reverse; }
  .arm-l { transform-origin: 17px 18px; animation: swing 0.45s ease-in-out infinite alternate-reverse; }
  .body-bob { animation: bob 0.225s ease-in-out infinite alternate; }

  @keyframes swing {
    from { transform: rotate(-25deg); }
    to   { transform: rotate(25deg); }
  }
  @keyframes bob {
    from { transform: translateY(0px); }
    to   { transform: translateY(-2px); }
  }
</style>
</head>
<body>

<div class="player-stage" id="stageBox">

  <!-- CHIBI EIKO (Cheveux noirs, casque néon bleu, cristal bleu) -->
  <svg class="walker" viewBox="0 0 34 40">
    <g class="body-bob">
      <!-- Cheveux noirs arrière flottants -->
      <path d="M12 10 Q6 18 8 28 Q13 26 15 28 Q17 20 16 10 Z" fill="#0f0c1d" stroke="#38bdf8" stroke-width="0.6"/>
      <!-- Jambe arrière -->
      <line class="leg-r" x1="17" y1="26" x2="17" y2="35" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
      <!-- Robe / Tenue noire -->
      <path d="M13 17 L21 17 L23 27 L11 27 Z" fill="#090910" stroke="#38bdf8" stroke-width="0.8"/>
      <!-- Pendentif Cristal Bleu -->
      <polygon points="18,19 20,21.5 18,24 16,21.5" fill="#38bdf8"/>
      <!-- Tête chibi -->
      <circle cx="17" cy="11" r="6.5" fill="#fde6d8"/>
      <!-- Frange cheveux noirs -->
      <path d="M10.5 11 C10.5 5, 23.5 5, 23.5 11 C21 8, 18 9, 17 11 C15 9, 12 8, 10.5 11 Z" fill="#0f0c1d"/>
      <!-- Oeil fermé paisible -->
      <path d="M19 11.5 Q20.5 12.5 22 11.5" fill="none" stroke="#0f0c1d" stroke-width="1.1" stroke-linecap="round"/>
      <!-- Casque Audio Néon Bleu -->
      <path d="M11 10 A6.5 6.5 0 0 1 23 10" fill="none" stroke="#1e293b" stroke-width="2"/>
      <circle cx="16.5" cy="11" r="2.8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="16.5" cy="11" r="1" fill="#38bdf8"/>
      <!-- Jambe avant -->
      <line class="leg-l" x1="17" y1="26" x2="17" y2="35" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <!-- Bras -->
      <line class="arm-l" x1="17" y1="18" x2="17" y2="24" stroke="#fde6d8" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </svg>

  <!-- CHIBI CAROL (Cheveux châtains tressés, tenue noire/or, casque doré) -->
  <svg class="walker walker-carol" viewBox="0 0 34 40">
    <g class="body-bob">
      <!-- Cheveux châtains arrière -->
      <path d="M12 10 Q5 18 7 29 Q13 27 16 28 Q17 20 16 10 Z" fill="#9a6338" stroke="#f59e0b" stroke-width="0.6"/>
      <!-- Jambe arrière -->
      <line class="leg-r" x1="17" y1="26" x2="17" y2="35" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
      <!-- Robe noire et dorée -->
      <path d="M13 17 L21 17 L23 27 L11 27 Z" fill="#18121e" stroke="#f59e0b" stroke-width="0.9"/>
      <!-- Tête chibi -->
      <circle cx="17" cy="11" r="6.5" fill="#fde6d8"/>
      <!-- Frange cheveux châtains -->
      <path d="M10.5 11 C10.5 5, 23.5 5, 23.5 11 C21 8, 18 9, 17 11 C15 9, 12 8, 10.5 11 Z" fill="#855129"/>
      <!-- Grand sourire joyeux -->
      <path d="M19 10.5 Q20.5 9.2 22 10.5" fill="none" stroke="#451a03" stroke-width="1.1" stroke-linecap="round"/>
      <path d="M19.5 13 Q20.8 14.8 22 13 Z" fill="#f43f5e"/>
      <!-- Casque Audio Doré -->
      <path d="M11 10 A6.5 6.5 0 0 1 23 10" fill="none" stroke="#292524" stroke-width="2"/>
      <circle cx="16.5" cy="11" r="2.8" fill="#1c1917" stroke="#fbbf24" stroke-width="1.2"/>
      <circle cx="16.5" cy="11" r="1" fill="#fbbf24"/>
      <!-- Jambe avant -->
      <line class="leg-l" x1="17" y1="26" x2="17" y2="35" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <!-- Bras -->
      <line class="arm-l" x1="17" y1="18" x2="17" y2="24" stroke="#fde6d8" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </svg>

  <!-- Le lecteur néon -->
  <div class="neon-wrapper" id="neonBox">
    <div class="mini-bar">
      <div class="track-info">
        <span>Nothing to me...</span>
        <button id="loopBtn" class="loop-btn" onclick="toggleLoop()">🔁 Boucle : ON</button>
      </div>
      <audio id="player" controls>
        <source src="episode2.mp3.mp3" type="audio/mpeg">
      </audio>
    </div>
  </div>

</div>

<script>
  let isLooping = true;
  const player = document.getElementById('player');
  const loopBtn = document.getElementById('loopBtn');
  const neonBox = document.getElementById('neonBox');
  const stageBox = document.getElementById('stageBox');

  function toggleLoop() {
    isLooping = !isLooping;
    loopBtn.innerText = isLooping ? '🔁 Boucle : ON' : '🔁 Boucle : OFF';
    loopBtn.classList.toggle('off', !isLooping);
  }

  player.addEventListener('play', () => {
    neonBox.classList.add('playing');
    stageBox.classList.add('playing');
  });
  player.addEventListener('pause', () => {
    neonBox.classList.remove('playing');
    stageBox.classList.remove('playing');
  });

  player.addEventListener('ended', function() {
    if (isLooping) {
      player.currentTime = 0;
      player.play();
    } else {
      neonBox.classList.remove('playing');
      stageBox.classList.remove('playing');
    }
  });
</script>

</body>
</html>
